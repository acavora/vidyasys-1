<svg viewBox="0 0 600 600" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="vs-navy-grad" x1="40" y1="20" x2="160" y2="70" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0a2558" />
      <stop offset="50%" stop-color="#0e3478" />
      <stop offset="100%" stop-color="#081e46" />
    </linearGradient>
    <linearGradient id="vs-wing-left" x1="30" y1="45" x2="100" y2="155" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0091ff" />
      <stop offset="35%" stop-color="#0072f5" />
      <stop offset="100%" stop-color="#0842a0" />
    </linearGradient>
    <linearGradient id="vs-wing-right" x1="170" y1="45" x2="100" y2="155" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0091ff" />
      <stop offset="35%" stop-color="#0072f5" />
      <stop offset="100%" stop-color="#0842a0" />
    </linearGradient>
    <linearGradient id="vs-page-left" x1="25" y1="120" x2="100" y2="155" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0077ff" />
      <stop offset="100%" stop-color="#0a2862" />
    </linearGradient>
    <linearGradient id="vs-page-right" x1="175" y1="120" x2="100" y2="155" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0077ff" />
      <stop offset="100%" stop-color="#0a2862" />
    </linearGradient>
  </defs>

  <g transform="translate(150, 40) scale(1.5)">
    <!-- Mortarboard Cap -->
    <path d="M 66 52 C 66 52, 100 68, 134 52 L 134 62 C 134 62, 100 78, 66 62 Z" fill="#061838" />
    <path d="M 100 16 L 165 46 L 100 72 L 35 46 Z" fill="url(#vs-navy-grad)" />
    <circle cx="100" cy="45.5" r="3.2" fill="#061633" />
    <path d="M 100 46 C 114 47, 142 50, 147 62 L 146 76" stroke="#0a2558" stroke-width="2.2" stroke-linecap="round" fill="none" />
    <path d="M 143.5 76 L 148.5 76 L 150 92 L 142 92 Z" fill="#081e46" />
    <circle cx="146" cy="76" r="2" fill="#081e46" />

    <!-- Students -->
    <circle cx="75" cy="74" r="7.5" fill="#3284ff" />
    <path d="M 62 98 C 62 87, 69 83, 75 83 C 81 83, 87 87, 88 98 Z" fill="#3284ff" />

    <circle cx="125" cy="74" r="7.5" fill="#3284ff" />
    <path d="M 112 98 C 113 87, 119 83, 125 83 C 131 83, 138 87, 138 98 Z" fill="#3284ff" />

    <circle cx="100" cy="70" r="9.5" fill="#0a2558" />
    <path d="M 83 103 C 83 89, 91 83, 100 83 C 109 83, 117 89, 117 103 Z" fill="#0a2558" />

    <!-- Book V Wings -->
    <path d="M 100 148 L 40 56 C 40 56, 52 50, 70 65 L 100 114 Z" fill="url(#vs-wing-left)" />
    <path d="M 100 148 L 160 56 C 160 56, 148 50, 130 65 L 100 114 Z" fill="url(#vs-wing-right)" />

    <!-- Lower Pages -->
    <path d="M 100 148 C 76 138, 48 118, 30 108 C 40 105, 78 126, 100 138 Z" fill="url(#vs-page-left)" />
    <path d="M 100 156 C 70 150, 38 136, 22 128 C 34 125, 70 139, 100 148 Z" fill="#0c3272" />
    <path d="M 100 148 C 124 138, 152 118, 170 108 C 160 105, 122 126, 100 138 Z" fill="url(#vs-page-right)" />
    <path d="M 100 156 C 130 150, 162 136, 178 128 C 166 125, 130 139, 100 148 Z" fill="#0c3272" />
    <polygon points="98,156 100,161 102,156" fill="#081e46" />
  </g>

  <!-- Vidyasys Text -->
  <text x="300" y="380" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="76" letter-spacing="-1.5">
    <tspan fill="#0a2558">Vidya</tspan><tspan fill="#0277fa">sys</tspan>
  </text>

  <!-- Tagline -->
  <text x="300" y="430" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="22" fill="#0a2558">
    One platform where students
  </text>
  <text x="300" y="462" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="24" fill="#0277fa">
    Learn, Share, Build &amp; Grow.
  </text>

  <!-- 4 Pillars Separator & Icons -->
  <g transform="translate(60, 495)">
    <!-- Notes -->
    <text x="50" y="30" font-family="system-ui, sans-serif" font-weight="700" font-size="20" fill="#0f172a">📖 Notes</text>
    <line x1="160" y1="12" x2="160" y2="36" stroke="#cbd5e1" stroke-width="2" />

    <!-- Projects -->
    <text x="180" y="30" font-family="system-ui, sans-serif" font-weight="700" font-size="20" fill="#0f172a">⚙️ Projects</text>
    <line x1="300" y1="12" x2="300" y2="36" stroke="#cbd5e1" stroke-width="2" />

    <!-- Tutoring -->
    <text x="320" y="30" font-family="system-ui, sans-serif" font-weight="700" font-size="20" fill="#0f172a">👥 Tutoring</text>
    <line x1="430" y1="12" x2="430" y2="36" stroke="#cbd5e1" stroke-width="2" />

    <!-- Resources -->
    <text x="450" y="30" font-family="system-ui, sans-serif" font-weight="700" font-size="20" fill="#0f172a">🔀 Resources</text>
  </g>
</svg>
